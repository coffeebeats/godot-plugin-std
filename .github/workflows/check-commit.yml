name: "🔎 Check: Godot project"

on:
  pull_request:
    branches:
      - tmp/check-project-probe-base
  push:
    branches:
      - tmp/check-project-probe-base

permissions:
  contents: write

jobs:
  check:
    uses: coffeebeats/godot-infra/.github/workflows/check-project.yaml@fix/check-project-test-submodule-bumps
    secrets: inherit

  # NOTE: This job name is required by the branch ruleset.
  branch_protection:
    needs: [check]
    if: ${{ always() }}

    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Verify status of dependencies
        if: |
          always() &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
